<title>MAM</title>
<style>
:root{--bg:#EEF2F7;--card:#fff;--fg:#0F172A;--muted:#64748B;--line:#E2E8F0;--accent:#2563EB;--in:#fff;--out:#2563EB;--ok:#16A34A;--off:#DC2626;--field:#F8FAFC}
@media (prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111B2E;--fg:#E5ECF6;--muted:#93A3B8;--line:#22314A;--accent:#3B82F6;--in:#1A2740;--out:#2563EB;--ok:#4ADE80;--off:#F87171;--field:#0D1627}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei","Noto Sans",sans-serif;display:flex;flex-direction:column}
.hero{background:linear-gradient(135deg,#0F172A,#16264a);color:#F8FAFC;padding:14px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;flex:none}
.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.3),transparent 65%)}
.logo{flex:none;width:44px;height:44px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0;position:relative;z-index:1}
.logo svg{width:100%;height:100%;display:block}
.t{position:relative;z-index:1;min-width:0;flex:1}.t b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:7px;font-size:12px;color:#CBD5E1;white-space:nowrap;margin-top:2px}.pill span{overflow:hidden;text-overflow:ellipsis}.dot{flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}.dot.on{background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
#list{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:2px}
.r{display:flex;align-items:flex-end;gap:8px}.r.me{justify-content:flex-end}.r.gf{margin-top:10px}
.col{display:flex;flex-direction:column;max-width:84%;min-width:0}.r.me .col{align-items:flex-end}.col .m{max-width:100%}
.av{width:32px;height:32px;border-radius:50%;background-size:cover;background-position:center top;background-repeat:no-repeat;overflow:hidden;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none;box-shadow:0 0 0 1px rgba(15,23,42,.08)}.sp{width:32px;flex:none}.r>.av{margin-bottom:21px}
.ts{font-size:11px;color:var(--muted);padding:2px 4px}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:260px}
.empty i{display:block;font-style:normal;font-size:38px;margin-bottom:6px}
.m{max-width:84%;padding:10px 13px;border-radius:16px;background:var(--in);border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.06);animation:up .3s ease both;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--out);color:#fff;border-color:transparent;border-bottom-right-radius:5px}
.m:not(.me){border-bottom-left-radius:5px}
.m small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.m .f{font-weight:700;font-size:12px;color:var(--accent);margin-bottom:2px}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card);flex:none}
input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--field);color:var(--fg);font:inherit;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
button{border:0;border-radius:999px;padding:0 20px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.35)}
button:disabled{opacity:.5}
.err{color:var(--off);font-size:12px;padding:0 16px 8px;min-height:20px}
.ban{flex:none;display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--off);color:#fff;font-weight:600}
.ban b{flex:1;min-width:0;font-weight:600}
.ban button{background:#fff;color:var(--off);box-shadow:none;padding:0 16px;height:30px}
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.box{background:var(--card);color:var(--fg);border-radius:16px;padding:20px;max-width:320px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.box i{font-size:34px;display:block;margin-bottom:8px}
.box p{margin:0 0 16px;line-height:1.5}
.box .row{display:flex;gap:10px}
.box .row button{flex:1}
.box .deny{background:var(--line);color:var(--fg);box-shadow:none}
.box label{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px;color:var(--muted);margin:0 0 14px;cursor:pointer}
.ban a{color:#fff;opacity:.85;text-decoration:underline;font-size:12px;cursor:pointer;flex:none}
.sup{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.sup button{height:34px;padding:0 16px;font-size:13px;box-shadow:none;white-space:nowrap}
.avb{position:relative;flex:none;width:44px;height:44px;padding:0;border-radius:50%;background:none;box-shadow:none;align-self:center}
.avb #avImg{display:block;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#CBD5E1 center top/cover no-repeat;box-shadow:0 0 0 1px var(--line)}
.avb #avImg svg{width:100%;height:100%;display:block}
.avb .cam{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--card);display:grid;place-items:center}
.avb .cam svg{width:9px;height:9px}
form button#bt{flex:none;height:44px;padding:0 20px}form input#tx{height:44px}
.box textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--fg);font:inherit;outline:none;resize:vertical;margin:4px 0 12px}
.box textarea:focus,.box .rin:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
.box .rin{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--fg);font:inherit;outline:none;margin:0 0 8px}
.box h4{margin:0 0 10px;font-size:15px}
.m.alert{background:#FEF3C7;border-color:#F59E0B;color:#78350F}.m.alert .f{color:#B45309}
.m.req{border-color:var(--accent);border-left:4px solid var(--accent)}
.toast{position:fixed;top:10px;left:12px;right:12px;z-index:30;background:#0F172A;color:#fff;border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none;animation:up .25s ease both;font-size:13px;cursor:pointer;border-left:5px solid #F59E0B}
.toast b{display:block;font-size:12px;color:#FBBF24}
.hbtn{position:relative;z-index:1;flex:none;width:36px;height:36px;padding:0;border-radius:10px;background:rgba(255,255,255,.14);box-shadow:none;font-size:15px;line-height:1}
body.mini #list,body.mini form,body.mini .err,body.mini .sup{display:none}
</style></head><body>
<div class="ban" id="ban"><b id="banTxt"></b><a id="banUntrust"></a><button id="banStop"></button></div>
<div class="ovl" id="ovl"><div class="box"><i>🖥️</i><p id="askTxt"></p><label><input type="checkbox" id="trust">&nbsp;<span id="trustTxt"></span></label><div class="row"><button class="deny" id="deny"></button><button id="allow"></button></div></div></div>
<div class="ovl" id="rovl"><div class="box" style="text-align:left;max-width:340px"><h4 id="rTitle"></h4>
<select id="rtype" class="rin"></select>
<input id="rname" class="rin" maxlength="60"><input id="rphone" class="rin" maxlength="30"><input id="remp" class="rin" maxlength="30"><input id="rpc" class="rin" maxlength="60">
<textarea id="rtx" rows="3" maxlength="500"></textarea><label style="justify-content:flex-start"><input type="checkbox" id="rurgent">&nbsp;<span id="rurgentTxt"></span></label><div id="rerr" style="color:var(--off);font-size:12px;min-height:16px;margin-bottom:8px"></div><div class="row"><button class="deny" id="rcancel"></button><button id="rsend"></button></div></div></div>
<div class="ovl" id="novl"><div class="box" style="text-align:left;max-width:340px"><h4 id="nTitle"></h4><input id="nin" class="rin" maxlength="40"><div id="nerr" style="color:var(--off);font-size:12px;min-height:16px;margin-bottom:8px"></div><div class="row"><button class="deny" id="ncancel"></button><button id="nsave"></button></div></div></div>
<div class="ovl" id="fovl"><div class="box" style="text-align:left;max-width:340px"><h4 id="fTitle"></h4><p id="fHint" style="font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5"></p><div class="row" style="margin-bottom:10px"><button id="fClean"></button><button id="fRam"></button></div><div id="fOut" style="font-size:12.5px;min-height:34px;margin-bottom:10px"></div><div class="row"><button class="deny" id="fClose"></button></div></div></div>
