<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAM Console</title>
<style>
:root{--bg:#0B1519;--bg2:#0F2026;--card:#13262D;--line:#2A4048;--ink:#E8ECEB;--mute:#93A8AE;--acc:#5FD0C4;--acc2:#2FA89B;--bad:#F2877F;--ok:#5FD0C4;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 78% -10%,#173540 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#10303A 0%,transparent 55%),var(--bg);color:var(--ink);font:400 14.5px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans",sans-serif;display:grid;place-items:center;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
/* đường nhịp tim chạy ngang nền, nhắc tới biểu tượng của MAM */
.pulse{position:absolute;left:0;right:0;width:100%;top:50%;height:160px;margin-top:-80px;opacity:.5;pointer-events:none}
.pulse path{fill:none;stroke:var(--acc);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240 2200;stroke-dashoffset:2440;animation:run 7s linear infinite;filter:drop-shadow(0 0 6px rgba(95,208,196,.55))}
.pulse .base{stroke:#1F3A42;stroke-dasharray:none;animation:none;filter:none;stroke-width:1}
@keyframes run{to{stroke-dashoffset:0}}
main{position:relative;width:min(460px,calc(100vw - 32px));display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:58px;height:58px;flex:none;border-radius:14px;background:transparent;box-shadow:0 8px 28px rgba(0,0,0,.35);display:grid;place-items:center}
.mark svg{width:44px;height:44px}
h1{margin:0;font-size:27px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.sub{margin:2px 0 0;color:var(--mute);font-size:13px;letter-spacing:.02em}
.card{background:linear-gradient(180deg,var(--card),#10222A);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px}
label.f{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;gap:10px}
.inp{flex:1;min-width:0;display:flex;align-items:center;background:#0C1A20;border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(95,208,196,.18)}
.inp span{padding-left:14px;color:var(--mute);font-size:14px}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:13px 14px 13px 4px}
button{font:inherit;cursor:pointer}
.go{border:0;border-radius:12px;padding:0 22px;background:var(--acc);color:#06201D;font-weight:700;transition:transform .1s,background .15s}
.go:hover{background:#7ADFD4}.go:active{transform:translateY(1px)}.go:disabled{opacity:.55;cursor:default}
.chk{display:flex;align-items:center;gap:9px;color:var(--mute);font-size:13px;cursor:pointer}
.chk input{accent-color:var(--acc);width:16px;height:16px}
.msg{min-height:20px;font-size:13px;color:var(--bad)}
.recent{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.recent h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.item:hover,.item:focus-visible{background:#183039;border-color:var(--line);outline:0}
.dot{width:9px;height:9px;border-radius:50%;background:#46606A;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(95,208,196,.2)}.dot.off{background:var(--bad)}
.item b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{color:var(--mute);font-size:12px}
.x{background:none;border:0;color:var(--mute);width:26px;height:26px;border-radius:7px;font-size:15px;line-height:1;opacity:0}
.item:hover .x,.item:focus-within .x{opacity:1}.x:hover{background:#244049;color:var(--ink)}
.foot{display:flex;justify-content:space-between;gap:12px;color:#6E858C;font-size:12px}
.lang{display:flex;gap:2px}
.lang button{background:none;border:0;color:#6E858C;padding:1px 6px;border-radius:6px;font-size:12px}
.lang button.on{color:var(--ink);background:#183039}
/* màn hình đang kết nối */
body.busy main>.card,body.busy .foot,body.busy .brand{display:none}
.splash{display:none;flex-direction:column;align-items:center;gap:18px;text-align:center}
body.busy .splash{display:flex}
.splash .mark{width:84px;height:84px;border-radius:20px;animation:beat 1.4s ease-in-out infinite}
.splash .mark svg{width:64px;height:64px}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.splash b{font-size:18px}.splash p{margin:0;color:var(--mute)}
.splash .cancel{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 18px}
.splash .cancel:hover{background:#183039}
@media (prefers-reduced-motion:reduce){.pulse path{animation:none;stroke-dasharray:none}.splash .mark{animation:none}}
