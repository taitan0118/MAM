<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MAM Console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo" id="brandLogo"></div>
      <div><b id="site-word">MAM Console</b><span>Missing App Monitor</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="avatar">?</div>
      <div class="who"><b id="whoName">—</b><span id="whoRole">—</span></div>
      <button class="iconbtn" id="logout" aria-label="Đăng xuất" style="margin-left:auto;width:30px;height:30px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="iconbtn menutoggle" id="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div><h1 id="pgTitle">Tổng quan</h1><div class="sub" id="pgSub"></div></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="theme" aria-label="Đổi giao diện sáng/tối">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="toasts"></div>
<script src="/missing-intro.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
